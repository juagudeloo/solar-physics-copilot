# Reusable job: lint and test one folder. Called once per folder from ci.yml.
name: Folder check

on:
  workflow_call:
    inputs:
      folder:
        description: Folder to check (contracts, pipeline, vlm or agent)
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pydantic
          if [ -f "${{ inputs.folder }}/requirements-ci.txt" ]; then
            pip install -r "${{ inputs.folder }}/requirements-ci.txt"
          fi

      - name: Lint (ruff E, F, I, RUF)
        run: ruff check ${{ inputs.folder }}

      - name: Compile check
        run: python -m compileall -q ${{ inputs.folder }}

      # TEMPORARY: pytest exits with code 5 when a folder has no tests yet. Treat that as a pass
      # until the first real test lands, then delete the `|| [ $? -eq 5 ]` part.
      - name: Tests and doctests
        run: pytest --doctest-modules ${{ inputs.folder }} || [ $? -eq 5 ]
